<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15402f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{title}} · Miqaat</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Marcellus&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/auth.css" />
  </head>
  <body>
    <main class="auth">
      <!-- Brand panel: replace /assets/img/logo.svg with the official artwork. -->
      <section class="brand">
        <div class="brand-inner">
          <img class="brand-logo" src="/assets/img/logo.svg" alt="Miqaat" width="160" height="112" />
          <div class="brand-divider" aria-hidden="true">
            <span></span>
            <svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 1 L19 10 L10 19 L1 10 Z" fill="none" stroke="currentColor" stroke-width="1.4" /><circle cx="10" cy="10" r="2.6" fill="currentColor" /></svg>
            <span></span>
          </div>
          <p class="brand-greeting" lang="ar" dir="rtl">أَهْلًا وَسَهْلًا</p>
          <p class="brand-tagline">{{tagline}}</p>
        </div>
      </section>

      <section class="panel">
        <div class="card">
          {{{content}}}
        </div>
        <footer class="panel-footer">© {{year}} Miqaat · Secured sign-in</footer>
      </section>
    </main>
    <script src="/assets/js/auth.js" defer></script>
  </body>
</html>
